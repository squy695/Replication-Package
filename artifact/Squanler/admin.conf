# Replace this file with the admin.conf (kubeconfig) of your own Kubernetes cluster,
# e.g. the file at /etc/kubernetes/admin.conf on the master node.
apiVersion: v1
kind: Config
clusters:
- cluster:
    certificate-authority-data: <BASE64_OF_YOUR_CLUSTER_CA_CERT>
    server: https://<YOUR_API_SERVER>:6443
  name: kubernetes
contexts:
- context:
    cluster: kubernetes
    user: kubernetes-admin
  name: kubernetes-admin@kubernetes
current-context: kubernetes-admin@kubernetes
users:
- name: kubernetes-admin
  user:
    client-certificate-data: <BASE64_OF_YOUR_CLIENT_CERT>
    client-key-data: <BASE64_OF_YOUR_CLIENT_KEY>
