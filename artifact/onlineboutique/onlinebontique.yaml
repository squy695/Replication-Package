# NOTE (replication package): this file pins the v0.10.5 Online Boutique images
# but was written for an older release, so two adjustments were applied:
#   * the exec probes were removed -- v0.10.5 images no longer ship
#     /bin/grpc_health_probe, without which no pod ever becomes Ready and every
#     Service has empty endpoints (the whole benchmark answers 500);
#   * DISABLE_PROFILER/DISABLE_TRACING/DISABLE_DEBUGGER were added to the two
#     Node services (they crash on startup otherwise) and
#     SHOPPING_ASSISTANT_SERVICE_ADDR to frontend (it panics without it).
# Verified on Kubernetes v1.21: every pod Ready, the shop serves HTTP 200.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      containers:
      - name: server
        image: us-central1-docker.pkg.dev/google-samples/microservices-demo/adservice:v0.10.5
        ports:
        - containerPort: 9555
        env:
        - name: PORT
          value: "9555"
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: "http://otelcollector:4317"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=adservice,service.version=1.0.0"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 50m
            memory: 360Mi
          limits:
            cpu: 300m
            memory: 600Mi
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: adservice
spec:
  type: ClusterIP
  selector:
    app: adservice
  ports:
  - name: grpc
    port: 9555
    targetPort: 9555



